name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.3", "28", "29"]
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.26.0"

      - name: Cache dependencies and PLT
        uses: actions/cache@v6
        with:
          path: |
            _build/default/lib
            _build/default/plugins
            _build/*_plt
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
          restore-keys: ${{ runner.os }}-otp-${{ matrix.otp }}-

      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 dialyzer

      # The GripMock suite is skipped when the image is missing, so pull it here.
      - name: Pull GripMock
        run: docker pull bavix/gripmock || true

      - run: rebar3 do eunit -v -c, ct -v -c, cover -v, covertool generate

      - name: Upload Common Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ct-logs-otp-${{ matrix.otp }}
          path: _build/test/logs
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-otp-${{ matrix.otp }}
          path: _build/test/covertool/egrpc.covertool.xml
          if-no-files-found: ignore
